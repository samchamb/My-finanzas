<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

/* ---------------------------------------------------------------------- */

const PALETTE = {

const ICONS = {

  TrendingUp: "📈", TrendingDown: "📉", Pencil: "✏️",
};
function Icon({ name, size = 16, color }) {
  return <span style={{ fontSize: size, lineHeight: 1, color: color || "inherit" }}>{ICONS[name] || ""}</span>;
}

const CATEGORY_LIST = ["Comida", "Transporte", "Compras", "Salud", "Entretenimiento", "Servicios", "Hogar", "Mascotas", "Educación", "Ahorro"];
const CATEGORY_ICON = { Comida: "🍔", Transporte: "🚗", Compras: "🛍️", Salud: "💊", Entretenimiento: "🎬", Servicios: "💡", Hogar: "🏠", Mascotas: "🐾", Educación: "📚", Ahorro: "🐷" };
const CATEGORY_COLOR = { Comida: PALETTE.pinkDeep, Transporte: PALETTE.blueDeep, Compras: PALETTE.lilacDeep, Salud: PALETTE.yellowDeep, Entretenimiento: PALETTE.sage, Servicios: PALETTE.sageDark, Hogar: "#D9B48F", Mascotas: "#B8D8BA", Educación: "#9DBFE0", Ahorro: "#C9A8D8" };
const CATEGORY_TYPE = { Comida: "necesidad", Transporte: "necesidad", Servicios: "necesidad", Hogar: "necesidad", Salud: "necesidad", Compras: "deseo", Entretenimiento: "deseo", Mascotas: "deseo", Educación: "deseo", Ahorro: "ahorro" };
const PAYMENT_METHODS = ["Efectivo", "Débito", "Crédito", "Transferencia", "Pago móvil"];
const SPANISH_MONTHS = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const MONTHS_SEED = [
  { key: "2024-01", label: "Enero 2024" }, { key: "2024-02", label: "Febrero 2024" },
  { key: "2024-03", label: "Marzo 2024" }, { key: "2024-04", label: "Abril 2024" },
  { key: "2024-05", label: "Mayo 2024" },
];

function getNextMonthDefault(months) {
  if (!months || !months.length) { const d = new Date(); return { monthIndex: d.getMonth(), year: d.getFullYear() }; }
  const sorted = [...months].sort((a, b) => a.key.localeCompare(b.key));
  const last = sorted[sorted.length - 1];
  const [y, m] = last.key.split("-").map(Number);
  let nm = m, ny = y;
  if (nm === 12) { nm = 1; ny = y + 1; } else { nm = nm + 1; }
  return { monthIndex: nm - 1, year: ny };
}

let _id = 1000;
const nextId = () => (_id++).toString(36);

function buildMonthTransactions(mesKey, ingresos, gastos, ahorros) {
  const list = [];
  const monthName = MONTHS_SEED.find(x => x.key === mesKey).label.split(" ")[0];
  list.push({ id: nextId(), mes: mesKey, fecha: `01 ${monthName}`, tipo: "Ingreso", categoria: "Salario", descripcion: "Salario mensual", metodo: "Transferencia", monto: ingresos });
  let day = 3, mi = 0;
  Object.entries(gastos).forEach(([cat, monto]) => {
    list.push({ id: nextId(), mes: mesKey, fecha: `${String(day).padStart(2, "0")} ${monthName}`, tipo: "Gasto", categoria: cat, descripcion: `Gasto en ${cat.toLowerCase()}`, metodo: PAYMENT_METHODS[mi % PAYMENT_METHODS.length], monto });
    day += 2; mi++;
  });
  list.push({ id: nextId(), mes: mesKey, fecha: `28 ${monthName}`, tipo: "Gasto", categoria: "Ahorro", descripcion: "Aporte a ahorro", metodo: "Transferencia", monto: ahorros });
  return list;
}

const MONTH_SEED = {
  "2024-01": { ingresos: 6200, ahorros: 1500, gastos: { Comida: 980, Transporte: 580, Compras: 420, Salud: 150, Entretenimiento: 260, Servicios: 430, Hogar: 200 } },
  "2024-02": { ingresos: 6300, ahorros: 1600, gastos: { Comida: 1010, Transporte: 600, Compras: 480, Salud: 170, Entretenimiento: 280, Servicios: 440, Hogar: 210 } },
  "2024-03": { ingresos: 6400, ahorros: 1700, gastos: { Comida: 1050, Transporte: 610, Compras: 500, Salud: 180, Entretenimiento: 290, Servicios: 445, Hogar: 215 } },
  "2024-04": { ingresos: 6450, ahorros: 1780, gastos: { Comida: 1080, Transporte: 615, Compras: 520, Salud: 190, Entretenimiento: 300, Servicios: 448, Hogar: 218 } },
  "2024-05": { ingresos: 6500, ahorros: 1850, gastos: { Comida: 1120, Transporte: 620, Compras: 540.75, Salud: 200, Entretenimiento: 315, Servicios: 450 } },
};

function seedTransactions() {
  let all = [];
  Object.entries(MONTH_SEED).forEach(([mesKey, v]) => { all = all.concat(buildMonthTransactions(mesKey, v.ingresos, v.gastos, v.ahorros)); });
  return all;
}
function seedFixedExpenses() {
  return [
    { id: nextId(), nombre: "Internet", dia: 5, monto: 250, categoria: "Servicios", pagado: { "2024-05": true, "2024-04": true, "2024-03": true, "2024-02": true, "2024-01": true } },
    { id: nextId(), nombre: "Spotify", dia: 12, monto: 29, categoria: "Entretenimiento", pagado: { "2024-05": true, "2024-04": true, "2024-03": true, "2024-02": true, "2024-01": true } },
    { id: nextId(), nombre: "Teléfono", dia: 15, monto: 100, categoria: "Servicios", pagado: { "2024-05": true, "2024-04": true, "2024-03": true, "2024-02": true, "2024-01": true } },
    { id: nextId(), nombre: "Electricidad", dia: 20, monto: 300, categoria: "Servicios", pagado: { "2024-05": false, "2024-04": true, "2024-03": true, "2024-02": true, "2024-01": true } },
    { id: nextId(), nombre: "Seguro médico", dia: 25, monto: 200, categoria: "Salud", pagado: { "2024-05": false, "2024-04": true, "2024-03": false, "2024-02": true, "2024-01": true } },
  ];
}
function seedAntExpenses() {
  return [

const fmt = (n, moneda = "Q") => `${moneda}${(Math.round(n * 100) / 100).toLocaleString("es-GT", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

function monthSummary(transactions, mesKey) {
  const rows = transactions.filter(t => t.mes === mesKey);
  const ingresos = rows.filter(t => t.tipo === "Ingreso").reduce((s, t) => s + t.monto, 0);
  const gastosTotales = rows.filter(t => t.tipo === "Gasto" && t.categoria !== "Ahorro").reduce((s, t) => s + t.monto, 0);
  const ahorros = rows.filter(t => t.tipo === "Gasto" && t.categoria === "Ahorro").reduce((s, t) => s + t.monto, 0);
  const disponible = ingresos - gastosTotales - ahorros;
  const pctAhorro = ingresos > 0 ? (ahorros / ingresos) * 100 : 0;
  const porCategoria = {};
  rows.filter(t => t.tipo === "Gasto").forEach(t => { porCategoria[t.categoria] = (porCategoria[t.categoria] || 0) + t.monto; });
  return { ingresos, gastosTotales, ahorros, disponible, pctAhorro, porCategoria };
}

function ChartCanvas({ config, height = 200 }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    const ctx = canvasRef.current.getContext("2d");
    chartRef.current = new Chart(ctx, config);
    return () => chartRef.current && chartRef.current.destroy();
  }, [JSON.stringify(config)]);
  return <div style={{ position: "relative", width: "100%", height }}><canvas ref={canvasRef}></canvas></div>;
}

function ProgressBar({ pct, color = PALETTE.sage, bg = PALETTE.sageLight, height = 10 }) {

function DonutMini({ pct, color, size = 88, label }) {
  const r = 34, c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} viewBox="0 0 90 90">
      <circle cx="45" cy="45" r={r} fill="none" stroke={PALETTE.sageLight} strokeWidth="10" />
      <circle cx="45" cy="45" r={r} fill="none" stroke={color} strokeWidth="10" strokeDasharray={c} strokeDashoffset={c - (pct / 100) * c} strokeLinecap="round" transform="rotate(-90 45 45)" />
      <text x="45" y="42" textAnchor="middle" fontSize="17" fontWeight="700" fill={PALETTE.text}>{Math.round(pct)}%</text>
      {label && <text x="45" y="58" textAnchor="middle" fontSize="7" fill={PALETTE.textMuted}>{label}</text>}

  );
}

function MonthPicker({ mesKey, setMesKey, months, setMonths, setTransactions, moneda }) {
  const [open, setOpen] = useState(false);
  const [showAdd, setShowAdd] = useState(false);
  const [newMonthIdx, setNewMonthIdx] = useState(0);
  const [newYear, setNewYear] = useState(2024);
  const [newIngreso, setNewIngreso] = useState("");
  const [errorMsg, setErrorMsg] = useState("");
  const label = months.find(m => m.key === mesKey)?.label || "Selecciona un mes";

  const openAdd = () => {
    const n = getNextMonthDefault(months);
    setNewMonthIdx(n.monthIndex); setNewYear(n.year); setNewIngreso(""); setErrorMsg("");
    setShowAdd(true); setOpen(false);
  };

  const submitAdd = () => {
    const key = `${newYear}-${String(newMonthIdx + 1).padStart(2, "0")}`;
    if (months.some(m => m.key === key)) { setErrorMsg("Ese mes ya existe en la lista."); return; }
    const newLabel = `${SPANISH_MONTHS[newMonthIdx]} ${newYear}`;
    setMonths(prev => [...prev, { key, label: newLabel }].sort((a, b) => a.key.localeCompare(b.key)));
    if (newIngreso && parseFloat(newIngreso) > 0 && setTransactions) {
      setTransactions(prev => [...prev, { id: nextId(), mes: key, fecha: `01 ${SPANISH_MONTHS[newMonthIdx]}`, tipo: "Ingreso", categoria: "Salario", descripcion: "Salario mensual", metodo: "Transferencia", monto: parseFloat(newIngreso) }]);
    }
    setMesKey(key);
    setShowAdd(false);
  };

  return (
    <div className="mf-monthpicker">
      <div className="mf-monthpicker-eyebrow">MES SELECCIONADO</div>
      <button className="mf-monthpicker-btn" onClick={() => setOpen(o => !o)}>
        <Icon name="Calendar" size={16} /> <span>{label}</span> <Icon name="ChevronDown" size={16} />
      </button>
      {open && (
        <div className="mf-monthpicker-list">
          {months.map(m => (
            <div key={m.key} className={`mf-monthpicker-opt ${m.key === mesKey ? "active" : ""}`} onClick={() => { setMesKey(m.key); setOpen(false); }}>{m.label}</div>
          ))}
          <div className="mf-monthpicker-opt mf-monthpicker-add" onClick={openAdd}>➕ Agregar mes</div>
        </div>
      )}
      {showAdd && (
        <Modal title="Agregar nuevo mes" onClose={() => setShowAdd(false)}>
          <Field label="Mes">
            <select value={newMonthIdx} onChange={e => setNewMonthIdx(parseInt(e.target.value))}>
              {SPANISH_MONTHS.map((m, i) => <option key={m} value={i}>{m}</option>)}
            </select>
          </Field>
          <Field label="Año"><input type="number" value={newYear} onChange={e => setNewYear(parseInt(e.target.value) || newYear)} /></Field>
          <Field label={`Ingreso mensual (opcional, ${moneda})`}><input type="number" value={newIngreso} onChange={e => setNewIngreso(e.target.value)} placeholder="Ej. 6500" /></Field>
          {errorMsg && <p style={{ color: "#C4677C", fontSize: 12.5, marginTop: -6 }}>{errorMsg}</p>}
          <button className="mf-btn-primary mf-btn-block" onClick={submitAdd}><Icon name="Check" size={16} /> Agregar mes</button>
        </Modal>
      )}
    </div>
  );
}

function Registro({ transactions, setTransactions, mesKey, setMesKey, categorias, moneda, months, setMonths }) {
  const [showForm, setShowForm] = useState(false);
  const rows = transactions.filter(t => t.mes === mesKey).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const empty = { tipo: "Gasto", categoria: categorias[0], descripcion: "", metodo: PAYMENT_METHODS[0], monto: "", fecha: "" };
  const [form, setForm] = useState(empty);

  const submit = () => {
    if (!form.monto || !form.fecha) return;
    setTransactions(prev => [...prev, { id: nextId(), mes: mesKey, fecha: form.fecha, tipo: form.tipo, categoria: form.categoria, descripcion: form.descripcion || form.categoria, metodo: form.metodo, monto: parseFloat(form.monto) }]);
    setForm(empty); setShowForm(false);
  };
  const remove = id => setTransactions(prev => prev.filter(t => t.id !== id));

  return (
    <div className="mf-page">
      <div className="mf-page-head">
        <h1>🧾 Registro de gastos</h1>
        <div className="mf-page-head-actions">
          <MonthPicker mesKey={mesKey} setMesKey={setMesKey} months={months} setMonths={setMonths} setTransactions={setTransactions} moneda={moneda} />
          <button className="mf-btn-primary" onClick={() => setShowForm(true)}><Icon name="Plus" size={16} /> Agregar movimiento</button>
        </div>
      </div>
      <Card>
        <table className="mf-table">
          <thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Descripción</th><th>Método</th><th>Monto</th><th></th></tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.id}>
                <td>{r.fecha}</td>
                <td><span className={`mf-badge ${r.tipo === "Ingreso" ? "in" : "out"}`}><Icon name={r.tipo === "Ingreso" ? "TrendingUp" : "TrendingDown"} size={12} /> {r.tipo}</span></td>
                <td>{CATEGORY_ICON[r.categoria] || "•"} {r.categoria}</td>
                <td>{r.descripcion}</td>
                <td>{r.metodo}</td>
                <td className={r.tipo === "Ingreso" ? "mf-pos" : "mf-neg"}>{r.tipo === "Ingreso" ? "+" : "-"}{fmt(r.monto, moneda)}</td>
                <td><button className="mf-icon-btn" onClick={() => remove(r.id)}><Icon name="Trash2" size={15} /></button></td>
              </tr>
            ))}
            {rows.length === 0 && <tr><td colSpan={7}><EmptyState text="No hay movimientos registrados este mes." /></td></tr>}
          </tbody>
        </table>
      </Card>
      {showForm && (
        <Modal title="Agregar movimiento" onClose={() => setShowForm(false)}>
          <Field label="Tipo"><select value={form.tipo} onChange={e => setForm(f => ({ ...f, tipo: e.target.value }))}><option>Gasto</option><option>Ingreso</option></select></Field>
          <Field label="Fecha (ej. 14 Mayo)"><input value={form.fecha} onChange={e => setForm(f => ({ ...f, fecha: e.target.value }))} placeholder="14 Mayo" /></Field>

function GastosFijos({ fixedExpenses, setFixedExpenses, mesKey, setMesKey, categorias, moneda, months, setMonths, setTransactions }) {
  const [showForm, setShowForm] = useState(false);
  const empty = { nombre: "", dia: "", monto: "", categoria: categorias[0] };
  const [form, setForm] = useState(empty);
  const toggle = id => setFixedExpenses(prev => prev.map(f => f.id === id ? { ...f, pagado: { ...f.pagado, [mesKey]: !f.pagado[mesKey] } } : f));
  const remove = id => setFixedExpenses(prev => prev.filter(f => f.id !== id));
  const submit = () => {
    if (!form.nombre || !form.monto || !form.dia) return;
    setFixedExpenses(prev => [...prev, { id: nextId(), nombre: form.nombre, dia: parseInt(form.dia), monto: parseFloat(form.monto), categoria: form.categoria, pagado: {} }]);
    setForm(empty); setShowForm(false);
  };
  const pagados = fixedExpenses.filter(f => f.pagado[mesKey]).length;
  const pct = fixedExpenses.length ? (pagados / fixedExpenses.length) * 100 : 0;
  const monthLabel = months.find(m => m.key === mesKey).label.split(" ")[0];

  return (
    <div className="mf-page">
      <div className="mf-page-head">
        <h1>📋 Gastos fijos</h1>

        </div>
      </div>
      <Card>
        <table className="mf-table">
          <thead><tr><th>Gasto</th><th>Categoría</th><th>Fecha de pago</th><th>Monto</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            {fixedExpenses.map(f => (
              <tr key={f.id}>
                <td>{f.nombre}</td><td>{CATEGORY_ICON[f.categoria]} {f.categoria}</td><td>{String(f.dia).padStart(2, "0")} {monthLabel}</td><td>{fmt(f.monto, moneda)}</td>
                <td><button className="mf-checkbox" onClick={() => toggle(f.id)}>{f.pagado[mesKey] ? "☑" : "☐"}</button></td>
                <td><button className="mf-icon-btn" onClick={() => remove(f.id)}><Icon name="Trash2" size={15} /></button></td>
              </tr>
            ))}
          </tbody>
        </table>
        <div className="mf-fixed-summary" style={{ marginTop: 16 }}><span>Pagados: {pagados} de {fixedExpenses.length}</span><ProgressBar pct={pct} /><span>{Math.round(pct)}%</span></div>
      </Card>
      {showForm && (
        <Modal title="Agregar gasto fijo" onClose={() => setShowForm(false)}>
          <Field label="Nombre"><input value={form.nombre} onChange={e => setForm(f => ({ ...f, nombre: e.target.value }))} placeholder="Ej. Netflix" /></Field>
          <Field label="Día de pago (1-31)"><input type="number" value={form.dia} onChange={e => setForm(f => ({ ...f, dia: e.target.value }))} placeholder="15" /></Field>
          <Field label="Categoría"><select value={form.categoria} onChange={e => setForm(f => ({ ...f, categoria: e.target.value }))}>{categorias.map(c => <option key={c}>{c}</option>)}</select></Field>
          <Field label={`Monto (${moneda})`}><input type="number" value={form.monto} onChange={e => setForm(f => ({ ...f, monto: e.target.value }))} placeholder="0.00" /></Field>
          <button className="mf-btn-primary mf-btn-block" onClick={submit}><Icon name="Check" size={16} /> Guardar</button>
        </Modal>
      )}

  );
}

function Metas({ goals, setGoals, moneda }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const empty = { nombre: "", icono: "🎯", objetivo: "", ahorrado: "", fecha: "" };
  const [form, setForm] = useState(empty);
  const openNew = () => { setForm(empty); setEditing(null); setShowForm(true); };
  const openEdit = g => { setForm({ nombre: g.nombre, icono: g.icono, objetivo: g.objetivo, ahorrado: g.ahorrado, fecha: g.fecha }); setEditing(g.id); setShowForm(true); };
  const remove = id => setGoals(prev => prev.filter(g => g.id !== id));
  const submit = () => {
    if (!form.nombre || !form.objetivo) return;
    if (editing) setGoals(prev => prev.map(g => g.id === editing ? { ...g, ...form, objetivo: parseFloat(form.objetivo), ahorrado: parseFloat(form.ahorrado || 0) } : g));
    else setGoals(prev => [...prev, { id: nextId(), nombre: form.nombre, icono: form.icono || "🎯", objetivo: parseFloat(form.objetivo), ahorrado: parseFloat(form.ahorrado || 0), fecha: form.fecha }]);
    setShowForm(false);
  };

  return (
    <div className="mf-page">
      <div className="mf-page-head"><h1>🎯 Metas de ahorro</h1><button className="mf-btn-primary" onClick={openNew}><Icon name="Plus" size={16} /> Agregar meta</button></div>
      <div className="mf-goals-grid">
        {goals.map(g => {
          const pct = (g.ahorrado / g.objetivo) * 100;
          return (
            <Card key={g.id} className="mf-goal-card">
              <div className="mf-goal-card-head">
                <div className="mf-goal-card-title"><span className="mf-goal-icon">{g.icono}</span>{g.nombre}</div>
                <div className="mf-goal-card-actions">
                  <button className="mf-icon-btn" onClick={() => openEdit(g)}><Icon name="Pencil" size={14} /></button>
                  <button className="mf-icon-btn" onClick={() => remove(g.id)}><Icon name="Trash2" size={14} /></button>
                </div>
              </div>
              <div className="mf-goal-amounts">{fmt(g.ahorrado, moneda)} <span>/ {fmt(g.objetivo, moneda)}</span></div>
              <ProgressBar pct={pct} color={pct >= 100 ? PALETTE.sageDark : PALETTE.sage} height={12} />
              <div className="mf-goal-footer"><span>{Math.round(pct)}% completado</span>{g.fecha && <span>📅 {g.fecha}</span>}</div>
            </Card>
          );
        })}
        {goals.length === 0 && <EmptyState text="Aún no tienes metas. ¡Agrega la primera!" />}
      </div>
      {showForm && (
        <Modal title={editing ? "Editar meta" : "Agregar meta"} onClose={() => setShowForm(false)}>
          <Field label="Nombre de la meta"><input value={form.nombre} onChange={e => setForm(f => ({ ...f, nombre: e.target.value }))} placeholder="Ej. Viaje a la playa" /></Field>
          <Field label="Icono (emoji)"><input value={form.icono} onChange={e => setForm(f => ({ ...f, icono: e.target.value }))} placeholder="🏝" /></Field>
          <Field label={`Monto objetivo (${moneda})`}><input type="number" value={form.objetivo} onChange={e => setForm(f => ({ ...f, objetivo: e.target.value }))} placeholder="2000" /></Field>
          <Field label={`Monto ahorrado (${moneda})`}><input type="number" value={form.ahorrado} onChange={e => setForm(f => ({ ...f, ahorrado: e.target.value }))} placeholder="0" /></Field>
          <Field label="Fecha límite (opcional)"><input value={form.fecha} onChange={e => setForm(f => ({ ...f, fecha: e.target.value }))} placeholder="31 Dic 2024" /></Field>
          <button className="mf-btn-primary mf-btn-block" onClick={submit}><Icon name="Check" size={16} /> Guardar meta</button>
        </Modal>
      )}
    </div>
  );
}

function ResumenAnual({ transactions, moneda, months }) {
  const data = months.map(m => { const s = monthSummary(transactions, m.key); return { mes: m.label.split(" ")[0].slice(0, 3), Ingresos: Math.round(s.ingresos), Gastos: Math.round(s.gastosTotales), Ahorros: Math.round(s.ahorros) }; });
  const totalIngresos = data.reduce((s, d) => s + d.Ingresos, 0);
  const totalGastos = data.reduce((s, d) => s + d.Gastos, 0);
  const totalAhorros = data.reduce((s, d) => s + d.Ahorros, 0);
  const pctAhorroProm = totalIngresos > 0 ? (totalAhorros / totalIngresos) * 100 : 0;

  const lineConfig = {
    type: "line",
    data: { labels: data.map(d => d.mes), datasets: [
      { label: "Ingresos", data: data.map(d => d.Ingresos), borderColor: PALETTE.sage, backgroundColor: PALETTE.sage, tension: 0.3, pointRadius: 4 },
      { label: "Gastos", data: data.map(d => d.Gastos), borderColor: PALETTE.pinkDeep, backgroundColor: PALETTE.pinkDeep, tension: 0.3, pointRadius: 4 },
      { label: "Ahorros", data: data.map(d => d.Ahorros), borderColor: PALETTE.lilacDeep, backgroundColor: PALETTE.lilacDeep, tension: 0.3, pointRadius: 4 },
    ] },
    options: { plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } }, tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${fmt(ctx.parsed.y, moneda)}` } } },
      scales: { x: { grid: { display: false } }, y: { grid: { color: PALETTE.border }, ticks: { callback: v => `${moneda}${v / 1000}k` } } } },
  };

  return (
    <div className="mf-page">
      <div className="mf-page-head"><h1>📊 Resumen anual</h1></div>
      <div className="mf-summary-grid" style={{ gridTemplateColumns: "repeat(4, 1fr)" }}>
        <Card className="mf-summary-card"><div className="mf-summary-label">INGRESOS ACUMULADOS</div><div className="mf-summary-value" style={{ color: PALETTE.sageDark }}>{fmt(totalIngresos, moneda)}</div></Card>
        <Card className="mf-summary-card"><div className="mf-summary-label">GASTOS ACUMULADOS</div><div className="mf-summary-value" style={{ color: "#C4677C" }}>{fmt(totalGastos, moneda)}</div></Card>
        <Card className="mf-summary-card"><div className="mf-summary-label">AHORRO ACUMULADO</div><div className="mf-summary-value" style={{ color: "#C99A2E" }}>{fmt(totalAhorros, moneda)}</div></Card>
        <Card className="mf-summary-card"><div className="mf-summary-label">% AHORRO PROMEDIO</div><div className="mf-summary-value" style={{ color: PALETTE.lilacDeep }}>{Math.round(pctAhorroProm)}%</div></Card>
      </div>
      <Card className="mf-chart-card">
        <div className="mf-card-title">EVOLUCIÓN MENSUAL</div>
        <ChartCanvas config={lineConfig} height={280} />
      </Card>
    </div>
  );
}

function Configuracion({ categorias, setCategorias, metodos, setMetodos, presupuesto, setPresupuesto, moneda, setMoneda, onExport, onReset }) {
  const [newCat, setNewCat] = useState("");
  const [newMet, setNewMet] = useState("");
  const addCat = () => { if (newCat.trim()) { setCategorias(prev => [...prev, newCat.trim()]); setNewCat(""); } };
  const removeCat = c => setCategorias(prev => prev.filter(x => x !== c));
  const addMet = () => { if (newMet.trim()) { setMetodos(prev => [...prev, newMet.trim()]); setNewMet(""); } };
  const removeMet = m => setMetodos(prev => prev.filter(x => x !== m));

  return (
    <div className="mf-page">
      <div className="mf-page-head"><h1>⚙️ Configuración</h1></div>
      <div className="mf-config-grid">
        <Card>
          <div className="mf-card-title">💾 Respaldo de tu historial</div>
          <p className="mf-config-note">Tus datos se guardan automáticamente en este navegador. Descarga un respaldo en Excel cuando quieras para tenerlo a salvo o revisarlo en tu computadora.</p>
          <button className="mf-btn-primary mf-btn-block" onClick={onExport} style={{ marginTop: 10 }}>⬇️ Descargar respaldo en Excel</button>
          <button className="mf-btn-primary mf-btn-block" onClick={onReset} style={{ marginTop: 8, background: PALETTE.pinkDeep }}>🗑️ Restablecer datos de ejemplo</button>
        </Card>
        <Card>
          <div className="mf-card-title">Categorías</div>
          <div className="mf-chip-list">{categorias.map(c => <span key={c} className="mf-chip">{CATEGORY_ICON[c] || "•"} {c} <span className="mf-chip-x" onClick={() => removeCat(c)}>✕</span></span>)}</div>
          <div className="mf-add-row"><input value={newCat} onChange={e => setNewCat(e.target.value)} placeholder="Nueva categoría" /><button className="mf-btn-primary" onClick={addCat}><Icon name="Plus" size={15} /></button></div>
        </Card>
        <Card>
          <div className="mf-card-title">Métodos de pago</div>
          <div className="mf-chip-list">{metodos.map(m => <span key={m} className="mf-chip">{m} <span className="mf-chip-x" onClick={() => removeMet(m)}>✕</span></span>)}</div>
          <div className="mf-add-row"><input value={newMet} onChange={e => setNewMet(e.target.value)} placeholder="Nuevo método" /><button className="mf-btn-primary" onClick={addMet}><Icon name="Plus" size={15} /></button></div>
        </Card>

          <div className="mf-card-title">Presupuesto mensual</div>
          <Field label={`Monto (${moneda})`}><input type="number" value={presupuesto} onChange={e => setPresupuesto(parseFloat(e.target.value) || 0)} /></Field>

        <Card>
          <div className="mf-card-title">Moneda</div>
          <Field label="Símbolo de moneda"><select value={moneda} onChange={e => setMoneda(e.target.value)}><option value="Q">Q — Quetzal</option><option value="$">$ — Dólar</option><option value="€">€ — Euro</option></select></Field>
        </Card>
        <Card>
          <div className="mf-card-title">Preferencias visuales</div>
          <p className="mf-config-note">🌿 Mi Finanzas usa una paleta suave y natural pensada para que revisar tus números se sienta tranquilo, no estresante.</p>
        </Card>
      </div>
    </div>
  );
}

const STORAGE_KEY = "miFinanzasData_v1";
function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* localStorage no disponible */ }
  return null;
}

function exportToExcel({ months, transactions, fixedExpenses, antExpenses, goals, moneda }) {
  if (typeof XLSX === "undefined") { alert("El módulo de Excel no cargó (revisa tu conexión a internet) e intenta de nuevo."); return; }
  const wb = XLSX.utils.book_new();

  const movRows = transactions.map(t => ({
    Fecha: t.fecha, Mes: months.find(m => m.key === t.mes)?.label || t.mes, Tipo: t.tipo,
    Categoría: t.categoria, Descripción: t.descripcion, "Método de pago": t.metodo, Monto: t.monto,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(movRows), "Movimientos");

  const fxRows = fixedExpenses.map(f => {
    const row = { Nombre: f.nombre, Categoría: f.categoria, "Día de pago": f.dia, Monto: f.monto };
    months.forEach(m => { row[`Pagado ${m.label}`] = f.pagado[m.key] ? "Sí" : "No"; });
    return row;
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(fxRows), "Gastos Fijos");

  const ahRows = antExpenses.map(a => ({ Fecha: a.fecha, Mes: months.find(m => m.key === a.mes)?.label || a.mes, Descripción: a.descripcion, Categoría: a.categoria, Monto: a.monto }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ahRows), "Gastos Hormiga");

  const mtRows = goals.map(g => ({ Meta: `${g.icono} ${g.nombre}`, Objetivo: g.objetivo, Ahorrado: g.ahorrado, "% Completado": Math.round((g.ahorrado / g.objetivo) * 100) + "%", "Fecha límite": g.fecha || "" }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mtRows), "Metas de Ahorro");

  const rsRows = months.map(m => {
    const s = monthSummary(transactions, m.key);
    return { Mes: m.label, Ingresos: Math.round(s.ingresos * 100) / 100, Gastos: Math.round(s.gastosTotales * 100) / 100, Ahorros: Math.round(s.ahorros * 100) / 100, Disponible: Math.round(s.disponible * 100) / 100, "% Ahorro": Math.round(s.pctAhorro * 10) / 10 + "%" };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rsRows), "Resumen Mensual");

  const today = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `MiFinanzas_Respaldo_${today}.xlsx`);
}

function App() {
  const saved = useMemo(loadSaved, []);
  const [page, setPage] = useState("dashboard");
  const [months, setMonths] = useState(saved?.months || MONTHS_SEED);
  const [mesKey, setMesKey] = useState(saved?.mesKey || "2024-05");
  const [transactions, setTransactions] = useState(saved?.transactions || seedTransactions);
  const [fixedExpenses, setFixedExpenses] = useState(saved?.fixedExpenses || seedFixedExpenses);
  const [antExpenses, setAntExpenses] = useState(saved?.antExpenses || seedAntExpenses);
  const [goals, setGoals] = useState(saved?.goals || seedGoals);
  const [categorias, setCategorias] = useState(saved?.categorias || CATEGORY_LIST);
  const [metodos, setMetodos] = useState(saved?.metodos || PAYMENT_METHODS);
  const [presupuesto, setPresupuesto] = useState(saved?.presupuesto ?? 9600);
  const [moneda, setMoneda] = useState(saved?.moneda || "Q");

  useEffect(() => {
    const data = { months, mesKey, transactions, fixedExpenses, antExpenses, goals, categorias, metodos, presupuesto, moneda };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* almacenamiento lleno o no disponible */ }
  }, [months, mesKey, transactions, fixedExpenses, antExpenses, goals, categorias, metodos, presupuesto, moneda]);

  const resetData = () => {
    if (!window.confirm("¿Seguro que quieres borrar todos tus datos guardados en este dispositivo y volver a los datos de ejemplo? Esta acción no se puede deshacer.")) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    setMonths(MONTHS_SEED); setMesKey("2024-05");
    setTransactions(seedTransactions()); setFixedExpenses(seedFixedExpenses());
    setAntExpenses(seedAntExpenses()); setGoals(seedGoals());
    setCategorias(CATEGORY_LIST); setMetodos(PAYMENT_METHODS);
    setPresupuesto(9600); setMoneda("Q");
  };

  return (
    <div className="mf-app">
      <Sidebar page={page} setPage={setPage} />
      <main className="mf-main">
        {page === "dashboard" && <Dashboard transactions={transactions} fixedExpenses={fixedExpenses} antExpenses={antExpenses} goals={goals} mesKey={mesKey} setMesKey={setMesKey} moneda={moneda} presupuesto={presupuesto} months={months} setMonths={setMonths} setTransactions={setTransactions} />}
        {page === "registro" && <Registro transactions={transactions} setTransactions={setTransactions} mesKey={mesKey} setMesKey={setMesKey} categorias={categorias} moneda={moneda} months={months} setMonths={setMonths} />}
        {page === "fijos" && <GastosFijos fixedExpenses={fixedExpenses} setFixedExpenses={setFixedExpenses} mesKey={mesKey} setMesKey={setMesKey} categorias={categorias} moneda={moneda} months={months} setMonths={setMonths} setTransactions={setTransactions} />}
        {page === "metas" && <Metas goals={goals} setGoals={setGoals} moneda={moneda} />}
        {page === "hormiga" && <GastosHormiga antExpenses={antExpenses} setAntExpenses={setAntExpenses} mesKey={mesKey} setMesKey={setMesKey} categorias={categorias} moneda={moneda} months={months} setMonths={setMonths} setTransactions={setTransactions} />}
        {page === "anual" && <ResumenAnual transactions={transactions} moneda={moneda} months={months} />}
        {page === "config" && (
          <Configuracion
            categorias={categorias} setCategorias={setCategorias} metodos={metodos} setMetodos={setMetodos}
            presupuesto={presupuesto} setPresupuesto={setPresupuesto} moneda={moneda} setMoneda={setMoneda}
            onExport={() => exportToExcel({ months, transactions, fixedExpenses, antExpenses, goals, moneda })}
            onReset={resetData}
          />
        )}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
